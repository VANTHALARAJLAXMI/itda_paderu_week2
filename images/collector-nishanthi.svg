<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5f0"/>
      <stop offset="100%" stop-color="#fedacb"/>
    </linearGradient>
    <linearGradient id="sareeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e91e63"/>
      <stop offset="100%" stop-color="#880e4f"/>
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="50%" stop-color="#fff8dc"/>
      <stop offset="100%" stop-color="#daa520"/>
    </linearGradient>
    <linearGradient id="skinGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5c29b"/>
      <stop offset="100%" stop-color="#e3a778"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="240" fill="url(#bgGrad2)"/>

  <!-- Shadow -->
  <ellipse cx="100" cy="225" rx="65" ry="12" fill="rgba(0,0,0,0.15)"/>

  <!-- Saree Body -->
  <path d="M 30 240 L 42 165 C 55 152 80 148 100 148 C 120 148 145 152 158 165 L 170 240 Z" fill="url(#sareeGrad)"/>
  
  <!-- Saree Pallu / Gold Border across shoulder -->
  <path d="M 42 165 C 60 175 100 200 135 240 L 170 240 C 130 190 85 165 52 155 Z" fill="url(#goldBorder)"/>
  <path d="M 45 162 Q 70 178 110 215" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.6"/>

  <!-- Blouse Neck Line -->
  <path d="M 80 148 Q 100 162 120 148 Z" fill="#880e4f"/>

  <!-- Neck -->
  <rect x="86" y="125" width="28" height="26" fill="url(#skinGrad2)" rx="3"/>
  <!-- Gold Chain/Mangalsutra -->
  <path d="M 86 135 Q 100 148 114 135" stroke="#ffd700" stroke-width="2" fill="none"/>

  <!-- Head -->
  <ellipse cx="100" cy="94" rx="33" ry="40" fill="url(#skinGrad2)"/>

  <!-- Ears -->
  <ellipse cx="66" cy="96" rx="5" ry="8" fill="#e3a778"/>
  <ellipse cx="134" cy="96" rx="5" ry="8" fill="#e3a778"/>
  <!-- Gold Earring studs -->
  <circle cx="66" cy="100" r="3" fill="#ffd700"/>
  <circle cx="134" cy="100" r="3" fill="#ffd700"/>

  <!-- Long Black Hair -->
  <path d="M 64 90 C 58 50 75 38 100 38 C 125 38 142 50 136 90 C 145 120 140 145 138 160 L 128 160 C 132 135 134 110 132 90 C 125 50 75 50 68 90 C 66 110 68 135 72 160 L 62 160 C 60 145 55 120 64 90 Z" fill="#1a1a1a"/>

  <!-- Eyebrows -->
  <path d="M 76 78 Q 85 73 93 77" stroke="#1a1a1a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 107 77 Q 115 73 124 78" stroke="#1a1a1a" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Red Bindi -->
  <circle cx="100" cy="76" r="3" fill="#d32f2f"/>

  <!-- Eyes -->
  <ellipse cx="85" cy="85" rx="5" ry="3.5" fill="#ffffff"/>
  <circle cx="85" cy="85" r="2.5" fill="#212121"/>
  <ellipse cx="115" cy="85" rx="5" ry="3.5" fill="#ffffff"/>
  <circle cx="115" cy="85" r="2.5" fill="#212121"/>

  <!-- Nose -->
  <path d="M 98 85 L 101 96 L 96 98" fill="none" stroke="#c98a5b" stroke-width="2" stroke-linecap="round"/>

  <!-- Smile Lips (Gentle Pink/Red) -->
  <path d="M 88 108 Q 100 117 112 108" stroke="#c2185b" stroke-width="3" fill="none" stroke-linecap="round"/>

</svg>
