<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4f6f8"/>
      <stop offset="100%" stop-color="#dbe2e8"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f1c5a0"/>
      <stop offset="100%" stop-color="#e0ac81"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cccccc"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="240" fill="url(#bgGrad)"/>
  
  <!-- Shadow -->
  <ellipse cx="100" cy="225" rx="65" ry="12" fill="rgba(0,0,0,0.15)"/>

  <!-- Body / White Shirt -->
  <path d="M 35 240 L 45 165 C 55 155 80 150 100 150 C 120 150 145 155 155 165 L 165 240 Z" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
  <!-- Collar -->
  <path d="M 75 152 L 100 178 L 125 152 L 115 150 L 100 162 L 85 150 Z" fill="#f8f9fa" stroke="#dcdcdc"/>
  <path d="M 85 150 L 100 178 L 72 178 Z" fill="#edf2f7"/>
  <path d="M 115 150 L 100 178 L 128 178 Z" fill="#edf2f7"/>

  <!-- Neck -->
  <rect x="85" y="130" width="30" height="26" fill="#e0ac81" rx="4"/>

  <!-- Head -->
  <ellipse cx="100" cy="95" rx="36" ry="44" fill="url(#skinGrad)"/>

  <!-- Ears -->
  <ellipse cx="63" cy="96" rx="6" ry="10" fill="#e0ac81"/>
  <ellipse cx="137" cy="96" rx="6" ry="10" fill="#e0ac81"/>

  <!-- Hair -->
  <path d="M 64 85 C 62 50 80 40 100 40 C 120 40 138 50 136 85 C 130 55 118 46 100 46 C 82 46 70 55 64 85 Z" fill="url(#hairGrad)"/>
  <!-- Side hair -->
  <path d="M 63 80 C 60 90 62 108 66 112 C 67 100 66 90 65 80 Z" fill="#e6e6e6"/>
  <path d="M 137 80 C 140 90 138 108 134 112 C 133 100 134 90 135 80 Z" fill="#e6e6e6"/>

  <!-- Eyebrows (Greyish) -->
  <path d="M 74 78 Q 84 74 92 78" stroke="#777777" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 108 78 Q 116 74 126 78" stroke="#777777" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Eyes -->
  <ellipse cx="84" cy="86" rx="4.5" ry="3" fill="#333333"/>
  <ellipse cx="116" cy="86" rx="4.5" ry="3" fill="#333333"/>
  <!-- Glasses Frame -->
  <rect x="73" y="80" width="22" height="13" rx="3" fill="none" stroke="#555555" stroke-width="2"/>
  <rect x="105" y="80" width="22" height="13" rx="3" fill="none" stroke="#555555" stroke-width="2"/>
  <line x1="95" y1="86" x2="105" y2="86" stroke="#555555" stroke-width="2"/>
  <line x1="63" y1="85" x2="73" y2="85" stroke="#555555" stroke-width="1.5"/>
  <line x1="127" y1="85" x2="137" y2="85" stroke="#555555" stroke-width="1.5"/>

  <!-- Nose -->
  <path d="M 98 86 L 102 99 L 95 102" fill="none" stroke="#c89368" stroke-width="2" stroke-linecap="round"/>

  <!-- Beard & French Stubble / White Beard -->
  <path d="M 70 108 C 72 135 85 144 100 144 C 115 144 128 135 130 108 C 124 130 112 138 100 138 C 88 138 76 130 70 108 Z" fill="#ffffff" opacity="0.9"/>
  <!-- Moustache -->
  <path d="M 82 107 Q 100 102 118 107 Q 100 114 82 107 Z" fill="#ffffff"/>

  <!-- Smile Lips -->
  <path d="M 88 112 Q 100 120 112 112" stroke="#b06c49" stroke-width="2.5" fill="none" stroke-linecap="round"/>

</svg>
